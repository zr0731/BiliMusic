<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiliMusic</title>
    <style>
      html, body { margin: 0; background: #17181a; }
      #boot-welcome {
        position: fixed; inset: 0; z-index: 80;
        display: flex; align-items: center; justify-content: center;
        padding: 72px 48px 96px;
        background: #17181a;
        animation: boot-leave .6s ease 2.1s forwards;
      }
      html[data-theme="light"] #boot-welcome { background: #f6f7f9; }
      #boot-welcome section {
        width: min(760px, calc(100vw - 120px)); min-height: 280px; box-sizing: border-box;
        padding: 48px 56px; border-radius: 30px; color: #fff;
        background: linear-gradient(135deg, #7b1233 0%, #4e255f 48%, #14324f 100%);
        box-shadow: 0 26px 80px rgba(0,0,0,.28);
        transform-origin: center;
        animation: boot-spread .7s cubic-bezier(.16,1,.3,1) both;
      }
      #boot-welcome p { margin: 0; letter-spacing: .14em; font-size: 13px; opacity: .8; }
      #boot-welcome h1 { margin: 12px 0; font-size: clamp(52px, 6vw, 80px); line-height: 1; letter-spacing: -.04em; }
      #boot-welcome span { font-size: 18px; opacity: .86; }
      @keyframes boot-spread { from { opacity: 0; transform: scaleX(.72) scaleY(.92); } to { opacity: 1; transform: none; } }
      @keyframes boot-leave { to { opacity: 0; visibility: hidden; } }
    </style>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob: bilimusic-audio:; connect-src 'self' https: ws://localhost:*; font-src 'self' data:; object-src 'none'; base-uri 'none'" />
  </head>
  <body>
    <div id="boot-welcome">
      <section>
        <p>BiliMusic</p>
        <h1>欢迎回来</h1>
        <span>正在准备今天的推荐。</span>
      </section>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
