name: Build Windows

# 只打 Windows 的 x64、ia32、arm64，并在同一次构建里产出平台无关的 OTA 渲染包。
# macOS、Linux 和鸿蒙已从本 fork 移除，找回方式见 docs/其他系统基线.md。
# 触发：推送 v* tag，或手动运行（workflow_dispatch，仅构建产物、不发布）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main process
        run: npm run build

      - name: Package (生成各架构安装包 + latest*.yml + blockmap)
        # --publish never 不上传，但仍生成 latest*.yml 与 blockmap，由 release job 统一发布
        run: npx electron-builder --win --x64 --ia32 --arm64 --publish never
        env:
          # CI 无签名证书：跳过 macOS 自动签名，产出未签名包
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build OTA renderer bundle
        run: node scripts/build-ota.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-latest
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/ota/ota.json
            release/ota/renderer-*.asar
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        # latest*.yml + 安装包 + blockmap + ota.json + renderer-<v>.asar 一并发布；
        # 发布为正式 release（非 draft），electron-updater 与 OTA manifest 方能从 latest 拉取
        uses: softprops/action-gh-release@v2
        with:
          name: BiliMusic ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: release-assets/**
